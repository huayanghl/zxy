<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>张栩滢 · 个人网站</title>
    <style>
        /* 全局重置与字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f6f3f0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #1e1e1e;
            line-height: 1.6;
            padding: 1.8rem 1.2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 2.8rem;
            padding: 2.8rem 2.2rem;
            box-shadow: 0 24px 48px -16px rgba(60, 40, 30, 0.12), 0 8px 20px -6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 245, 235, 0.5);
        }

        /* 头部区域 */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0.5rem 0 2rem 0;
            border-bottom: 1px solid rgba(180, 150, 130, 0.15);
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(145deg, #dccfc4, #cbb9ab);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 350;
            color: #2d2822;
            box-shadow: 0 14px 28px -10px rgba(100, 75, 60, 0.2);
            margin-bottom: 1.2rem;
            letter-spacing: 2px;
            user-select: none;
            transition: transform 0.25s ease;
        }

        .avatar:hover {
            transform: scale(1.02);
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #2b241e;
            margin-bottom: 0.2rem;
        }

        .hero .subhead {
            font-size: 1.1rem;
            font-weight: 400;
            color: #5f4d3e;
            background: rgba(210, 185, 165, 0.2);
            padding: 0.4rem 1.6rem;
            border-radius: 40px;
            display: inline-block;
            backdrop-filter: blur(2px);
            margin-top: 0.2rem;
            border: 1px solid rgba(200, 175, 155, 0.2);
        }

        /* 关于 / 简介 */
        .bio {
            margin: 2.2rem 0 2.5rem 0;
            padding: 0 0.5rem;
        }

        .bio p {
            font-size: 1.15rem;
            font-weight: 350;
            color: #2f2a25;
            max-width: 650px;
            margin: 0 auto;
            text-align: center;
            line-height: 1.8;
            letter-spacing: 0.2px;
        }

        .bio p span {
            background: linear-gradient(120deg, #e8ddd2 0%, #e8ddd2 40%, transparent 80%);
            padding: 0 0.3rem;
        }

        /* 联系卡片 */
        .contact-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.8rem;
            margin: 2.2rem 0 1.2rem 0;
        }

        .contact-item {
            background: rgba(250, 245, 240, 0.7);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(210, 190, 175, 0.25);
            padding: 0.9rem 2rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 1.1rem;
            font-weight: 450;
            color: #2b241e;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            cursor: default;
        }

        .contact-item:hover {
            background: rgba(245, 235, 225, 0.9);
            border-color: #c6b2a0;
            box-shadow: 0 8px 18px -8px rgba(100, 75, 60, 0.12);
            transform: translateY(-2px);
        }

        .contact-item .emoji {
            font-size: 1.5rem;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.02));
        }

        .contact-item .label {
            opacity: 0.7;
            font-weight: 400;
            margin-right: 0.1rem;
        }

        .contact-item .value {
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .contact-item .value.email {
            font-weight: 450;
            background: rgba(200, 180, 165, 0.15);
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
        }

        /* 社交 / 额外链接 (QQ) */
        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.8rem;
            margin-top: 2rem;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(180, 155, 135, 0.15);
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: #3a322b;
            font-size: 1rem;
            font-weight: 450;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            background: rgba(245, 238, 230, 0.5);
            border: 1px solid transparent;
            transition: all 0.2s;
            backdrop-filter: blur(2px);
        }

        .social-link:hover {
            background: #ede5dc;
            border-color: #cbb8a8;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px -6px rgba(80, 60, 45, 0.1);
        }

        .social-link .emoji {
            font-size: 1.4rem;
        }

        .social-link .label {
            font-weight: 400;
            opacity: 0.7;
        }

        .social-link .value {
            font-weight: 500;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 2.8rem;
            font-size: 0.9rem;
            color: #8f7b6b;
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(180, 155, 135, 0.1);
            padding-top: 2rem;
            font-weight: 350;
        }

        .footer small {
            opacity: 0.8;
        }

        .footer .heart {
            color: #b58d7a;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            body {
                padding: 1rem 0.8rem;
            }
            .container {
                padding: 1.8rem 1.2rem;
                border-radius: 2rem;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .avatar {
                width: 100px;
                height: 100px;
                font-size: 3.2rem;
            }
            .contact-grid {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }
            .contact-item {
                width: 100%;
                justify-content: center;
                padding: 0.7rem 1.2rem;
                font-size: 1rem;
            }
            .social-links {
                flex-direction: column;
                align-items: center;
                gap: 0.8rem;
            }
            .social-link {
                width: 100%;
                justify-content: center;
                padding: 0.6rem 1rem;
            }
            .bio p {
                font-size: 1rem;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 1.2rem 0.8rem;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .contact-item {
                font-size: 0.9rem;
                padding: 0.5rem 1rem;
            }
        }

        /* 辅助工具 - 选中样式 */
        ::selection {
            background: #dacbc0;
            color: #1f1a16;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 / 名字 + 头像 -->
        <div class="hero">
            <div class="avatar" aria-label="张栩滢 头像">
                🪷
            </div>
            <h1>张栩滢</h1>
            <div class="subhead">✦ 保持好奇 · 温和坚定 ✦</div>
        </div>

        <!-- 简介 -->
        <div class="bio">
            <p>
                <span>张栩滢</span> — 喜欢探索技术与生活的交汇点，<br>
                相信每一个细节都值得被认真对待。<br>
                这里是我的小小网络名片。
            </p>
        </div>

        <!-- 联系方式卡片（邮箱 + QQ） -->
        <div class="contact-grid">
            <!-- 邮箱 -->
            <div class="contact-item">
                <span class="emoji">✉️</span>
                <span class="label">邮箱</span>
                <span class="value email">zxy@zxynb.top</span>
            </div>
            <!-- QQ -->
            <div class="contact-item">
                <span class="emoji">💬</span>
                <span class="label">QQ</span>
                <span class="value">3572488180</span>
            </div>
        </div>

        <!-- 额外社交 / 快捷入口 ( 突出QQ ) -->
        <div class="social-links">
            <a href="mailto:zxy@zxynb.top" class="social-link" title="发送邮件">
                <span class="emoji">📧</span>
                <span class="label">邮件</span>
                <span class="value">zxy@zxynb.top</span>
            </a>
            <!-- QQ 链接 (tencent:// 协议可唤起QQ, 但移动端不一定支持，保留展示) -->
            <a href="tencent://message/?uin=3572488180&Site=personal&Menu=yes" class="social-link" title="QQ 联系">
                <span class="emoji">🐧</span>
                <span class="label">QQ</span>
                <span class="value">3572488180</span>
            </a>
            <!-- 额外占位：显示QQ号可复制 (提升可见性) -->
            <div class="social-link" style="cursor: default; background: rgba(235, 220, 210, 0.3);">
                <span class="emoji">📋</span>
                <span class="label">QQ号</span>
                <span class="value" style="font-weight: 500;">3572488180</span>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <small>
                <span class="heart">✦</span> 张栩滢 · 个人站点 <span class="heart">✦</span><br>
                <span style="opacity: 0.6; font-size: 0.8rem;">zxy@zxynb.top · 2026</span>
            </small>
        </div>
    </div>
</body>
</html>
